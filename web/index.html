<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1622" />
    <meta name="robots" content="noindex" />
    <!-- Older TV browsers can turn POST Origin into null with no-referrer. -->
    <meta name="referrer" content="same-origin" />
    <title>Fantasy Agents</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect width='8' height='8' fill='%231b1622'/><rect x='3' y='1' width='2' height='5' fill='%23b8c0cc'/><rect x='2' y='5' width='4' height='1' fill='%23f2c14e'/><rect x='3' y='6' width='2' height='1' fill='%238a5a34'/></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="startup" role="status" style="position:fixed;top:24px;left:24px;right:24px;padding:16px;background:#2a2233;color:#f4efe6;font:18px monospace;z-index:999;white-space:pre-wrap">Loading Fantasy Agents…</div>
    <noscript>This site requires JavaScript. Enable it in your TV browser settings.</noscript>
    <div id="app"></div>
    <script>
      // Keep this ES5 and outside the module graph: even an ignored entry script must be visible.
      var startup = document.getElementById("startup");
      var startupDone = false;
      function startupError(message) {
        startup.style.display = "block";
        startup.textContent = "Fantasy Agents could not start.\n" + message +
          "\nTry reloading this page. If it keeps failing, share this message and the browser information below.\n" + navigator.userAgent;
      }
      var startupTimer = setTimeout(function () {
        if (!startupDone) startupError("Loading is taking too long. A script may be blocked or unsupported by this TV browser.");
      }, 20000);
      window.addEventListener("fantasy-ready", function () {
        startupDone = true;
        clearTimeout(startupTimer);
        startup.style.display = "none";
      });
      window.addEventListener("error", function (e) {
        if (startupDone) return;
        clearTimeout(startupTimer);
        startupError(e.message || "A script or resource failed to load.");
      });
      window.addEventListener("unhandledrejection", function (e) {
        if (startupDone) return;
        clearTimeout(startupTimer);
        startupError(String(e.reason && e.reason.message || e.reason || "Startup failed."));
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1622" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Fantasy Agents</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect width='8' height='8' fill='%231b1622'/><rect x='3' y='1' width='2' height='5' fill='%23b8c0cc'/><rect x='2' y='5' width='4' height='1' fill='%23f2c14e'/><rect x='3' y='6' width='2' height='1' fill='%238a5a34'/></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // If startup fails on an old browser, say so instead of leaving a blank screen.
      window.addEventListener("error", function (e) {
        var d = document.createElement("pre");
        d.style.cssText = "position:fixed;left:0;right:0;top:0;margin:0;padding:12px;background:#400;color:#fff;font:16px monospace;white-space:pre-wrap;z-index:99";
        d.textContent = "Startup error: " + (e.message || "script failed to load") + " " + (e.filename || "") + ":" + (e.lineno || "");
        document.body.appendChild(d);
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
